name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Nova.sln
      - run: dotnet build Nova.sln -c Release --no-restore
      - run: dotnet test Nova.sln -c Release --no-build
